# Local development: docker compose up  (or podman-compose up)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: crewhealth
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20
  api:
    build: .
    depends_on:
      db: {condition: service_healthy}
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/crewhealth?sslmode=disable
      JWT_SECRET: dev-only-secret-change-me-0123456789abcdef
      SEED_DEMO: "true"
      CORS_ORIGINS: http://localhost:3016
      NASA_API_KEY: ${NASA_API_KEY:-DEMO_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
volumes:
  pgdata:
